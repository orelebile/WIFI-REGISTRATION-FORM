<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Public WiFi Registration</title>

  <link rel="stylesheet" href="css/index.css">
</head>

<body>

  <div class="container">
    <img src="get-image.png" alt="Public WiFi" class="logo">
    <p>Register below to connect</p>

    <form id="wifiForm">
      <div class="row">
        <div class="form-group">
          <label>First Name</label>
          <input type="text" id="firstName" required>
        </div>
        <div class="form-group">
          <label>Last Name</label>
          <input type="text" id="lastName" required>
        </div>
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" required>
      </div>

      <div class="form-group">
        <label>Phone Number</label>
        <input type="tel" id="phone" required>
      </div>

      <div class="form-group">
        <label>Company / Organization</label>
        <input type="text" id="company">
      </div>

      <div class="form-group">
        <label>Job Title / Position</label>
        <input type="text" id="job">
      </div>

      <button type="submit" class="btn">Register</button>

      <div class="checkbox">
        <input type="checkbox" id="terms">
        <label for="terms">Accept terms and conditions</label>
      </div>

      <div class="footer">
        Powered by:
      </div>
      <img src="burs logo.png" alt="BURS" class="footer-logo">

      <!-- Required by the hotspot platform. It replaces this token with its
           own "powered by" badge when the page is served, so the text must
           stay literal: do not comment it out or escape it. -->
      <div class="snippet">[[!PoweredBy]]</div>
    </form>
  </div>

  <script>
const scriptURL = "https://script.google.com/macros/s/AKfycbybxw1qvXqfTIulgQqdBoU2M0GV5DpLYEuiPqNP1V4QoPCB_9numLn1I7KJ7S5XVJ1h5g/exec";

document.getElementById("wifiForm").addEventListener("submit", function(e) {
  e.preventDefault();

  if (!document.getElementById("terms").checked) {
    alert("Please accept the terms and conditions.");
    return;
  }

  const data = {
    name: document.getElementById("firstName").value,
    surname: document.getElementById("lastName").value,
    email: document.getElementById("email").value,
    phone: document.getElementById("phone").value,
    company: document.getElementById("company").value,
    job: document.getElementById("job").value
  };

  console.log("Sending data:", data);

  fetch(scriptURL, {
    method: "POST",
    body: JSON.stringify(data)
  })
  .then(res => res.text())
  .then(response => {
    console.log("Server response:", response);
    alert("Registration successful!");
    document.getElementById("wifiForm").reset();
  })
  .catch(error => {
    console.error("FULL ERROR:", error);
    alert("Submission failed. Check console.");
  });
});
</script>   
</body>
</html>
